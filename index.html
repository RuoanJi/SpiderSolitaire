<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f3d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Spider Solitaire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='40' height='56' rx='6' fill='%23fff' stroke='%23333' stroke-width='3'/%3E%3Crect x='18' y='8' width='40' height='52' rx='6' fill='%232a6fd6' stroke='%23123' stroke-width='3'/%3E%3C/svg%3E" />
    <!--STYLE-->
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5L4 10l5 5" /><path d="M4 10h11a5 5 0 0 1 0 10h-3" /></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 5l5 5-5 5" /><path d="M20 10H9a5 5 0 0 0 0 10h3" /></symbol>
      <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" /></symbol>
      <symbol id="i-deal" viewBox="0 0 24 24"><rect x="4" y="7" width="11" height="14" rx="2" /><path d="M8 4h9a2 2 0 0 1 2 2v12" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" class="fill" /><circle cx="12" cy="12" r="1.7" class="fill" /><circle cx="19" cy="12" r="1.7" class="fill" /></symbol>
      <symbol id="i-rules" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /><circle cx="9" cy="6" r="2" class="knob" /><circle cx="15" cy="12" r="2" class="knob" /><circle cx="7" cy="18" r="2" class="knob" /></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v5h5" /></symbol>
      <symbol id="i-stats" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6" /></symbol>
      <symbol id="i-options" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" /></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.1-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z" /><circle cx="7.5" cy="11" r="1.3" class="fill" /><circle cx="10.5" cy="7" r="1.3" class="fill" /><circle cx="15" cy="7.5" r="1.3" class="fill" /></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" /><circle cx="12" cy="17" r=".9" class="fill" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6" /><circle cx="12" cy="7.8" r=".9" class="fill" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
    </svg>

    <div id="app">
      <header class="appbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"><i></i><i></i></span>
          <span class="brand-name">Spider Solitaire</span>
          <button class="chip" id="rules-chip" data-act="new" aria-label="Game rules — start a new game with different rules"></button>
        </div>

        <div class="stats" aria-live="off">
          <div class="stat"><span>Score</span><b id="st-score">500</b></div>
          <div class="stat"><span>Moves</span><b id="st-moves">0</b></div>
          <div class="stat"><span>Time</span><b id="st-time">0:00</b></div>
          <div class="stat touch-only"><span>Deals</span><b id="st-deals">5</b></div>
        </div>

        <div class="actions">
          <button class="icon-btn" data-act="new-same" data-tip="New game · F2" aria-label="New game"><svg><use href="#i-new" /></svg></button>
          <span class="divider"></span>
          <button class="icon-btn" data-act="undo" data-tip="Undo · Ctrl+Z" aria-label="Undo"><svg><use href="#i-undo" /></svg></button>
          <button class="icon-btn" data-act="redo" data-tip="Redo · Ctrl+Y" aria-label="Redo"><svg><use href="#i-redo" /></svg></button>
          <button class="icon-btn" data-act="hint" data-tip="Hint · H" aria-label="Hint"><svg><use href="#i-hint" /></svg></button>
          <button class="icon-btn" data-act="deal" data-tip="Deal · D" aria-label="Deal"><svg><use href="#i-deal" /></svg><span class="badge" id="deal-badge">5</span></button>
          <span class="divider"></span>
          <button class="icon-btn" id="more-btn" data-tip="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-more" /></svg></button>
        </div>
      </header>

      <div class="popover" id="more-pop" role="menu" aria-label="Menu" hidden>
        <button role="menuitem" data-act="new"><svg><use href="#i-rules" /></svg><span>New game with rules…</span><kbd></kbd></button>
        <button role="menuitem" data-act="restart"><svg><use href="#i-restart" /></svg><span>Restart this game</span><kbd></kbd></button>
        <div class="sep"></div>
        <button role="menuitem" data-act="stats"><svg><use href="#i-stats" /></svg><span>Statistics</span><kbd>F3</kbd></button>
        <button role="menuitem" data-act="appearance"><svg><use href="#i-palette" /></svg><span>Appearance</span><kbd>F4</kbd></button>
        <button role="menuitem" data-act="options"><svg><use href="#i-options" /></svg><span>Options</span><kbd>F5</kbd></button>
        <div class="sep"></div>
        <button role="menuitem" data-act="help"><svg><use href="#i-help" /></svg><span>How to play</span><kbd>F1</kbd></button>
        <button role="menuitem" data-act="about"><svg><use href="#i-info" /></svg><span>About</span><kbd></kbd></button>
      </div>

      <main id="board" class="board" aria-label="Spider Solitaire table. Use arrow keys to choose a column, Enter to pick up and drop."></main>

      <nav class="toolbar" aria-label="Game controls">
        <button data-act="new" aria-label="New game"><svg><use href="#i-new" /></svg><span>New</span></button>
        <button data-act="hint" aria-label="Hint"><svg><use href="#i-hint" /></svg><span>Hint</span></button>
        <button data-act="deal" id="tb-deal" aria-label="Deal"><svg><use href="#i-deal" /></svg><span>Deal</span></button>
        <button data-act="more" aria-label="Menu"><svg><use href="#i-more" /></svg><span>Menu</span></button>
        <span class="tb-spacer"></span>
        <button data-act="redo" id="tb-redo" hidden aria-label="Redo"><svg><use href="#i-redo" /></svg><span>Redo</span></button>
        <button data-act="undo" id="tb-undo" class="undo" aria-label="Undo"><svg><use href="#i-undo" /></svg><span>Undo</span></button>
      </nav>

      <div id="toast" class="toast" role="status"></div>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </div>
    <!--SCRIPT-->
  </body>
</html>
